[package]
name = "nextplace-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Nextplace event source schema generation workflow"
authors = ["Kevin Mershon <kevin@mershonenterprises.com>"]

[dependencies]
# MCP protocol
rmcp = { version = "0.3", features = ["server", "transport-io", "macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
