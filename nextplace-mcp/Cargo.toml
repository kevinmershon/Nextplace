[package]
name = "nextplace-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Nextplace event source schema generation workflow"
authors = ["Kevin Mershon <kevin@mershonenterprises.com>"]

[dependencies]
# MCP protocol
rmcp = { version = "0.3", features = ["server", "transport-io", "macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# RocksDB - must match version used by Clojure app
rocksdb = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# EDN parsing (for RocksDB values written by Clojure)
edn-rs = "0.17"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
